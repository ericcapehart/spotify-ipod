plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ericcapehart.ipod'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ericcapehart.ipod'
        minSdk 22          // Android 5.1
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // The web app (index.html, app.js...) is copied in from the repo root at build time.
    sourceSets {
        main.assets.srcDirs += "$buildDir/generated/web"
    }
}

def copyWeb = tasks.register('copyWeb', Copy) {
    from(rootProject.file('..')) {
        include 'index.html', 'style.css', 'app.js', 'manifest.json', 'lib/**'
    }
    into "$buildDir/generated/web/www"
}
preBuild.dependsOn copyWeb
